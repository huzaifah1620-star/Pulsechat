<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulseChat Live — Cloud Real-Time Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB1PJ8csqWPqZY-Ch0MQjjB96qx9QAr7t0",
      authDomain: "pulsechat-962bc.firebaseapp.com",
      projectId: "pulsechat-962bc",
      storageBucket: "pulsechat-962bc.firebasestorage.app",
      messagingSenderId: "1018381268741",
      appId: "1:1018381268741:web:4e6d21670ddfa17c6da96c",
      measurementId: "G-KVM5X53ZPS"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    window.db = db;
    window.firebaseFns = { collection, addDoc, onSnapshot, query, orderBy, serverTimestamp };
    
    if (window.startPulseChat) window.startPulseChat();
  </script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
          }
        }
      }
    };
  </script>
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.3); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(156, 163, 175, 0.5); }
  </style>
</head>
<body class="bg-gray-100 dark:bg-zinc-950 text-gray-900 dark:text-zinc-100 h-screen overflow-hidden flex select-none">

  <!-- Sidebar -->
  <aside id="sidebar" class="fixed md:static inset-y-0 left-0 z-30 w-72 bg-white dark:bg-zinc-900 border-r border-gray-200 dark:border-zinc-800 flex flex-col transform -translate-x-full md:translate-x-0 transition-transform duration-200 ease-in-out">
    <div class="h-14 px-4 border-b border-gray-200 dark:border-zinc-800 flex items-center justify-between shrink-0">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-lg bg-brand-600 flex items-center justify-center text-white font-bold shadow-sm">⚡</div>
        <span class="font-bold text-lg tracking-tight">PulseChat Live</span>
      </div>
      <button onclick="openInviteModal()" title="Invite Friends" class="p-1.5 rounded-lg text-brand-600 dark:text-brand-400 hover:bg-indigo-50 dark:hover:bg-zinc-800 transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
      </button>
    </div>

    <!-- Channels List -->
    <div class="flex-1 overflow-y-auto px-3 py-4 space-y-6">
      <div>
        <div class="px-2 mb-1.5 flex items-center justify-between">
          <span class="text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-zinc-400">Channels</span>
        </div>
        <ul id="channelList" class="space-y-0.5">
          <li>
            <button onclick="selectChannel('general')" id="btn-general" class="w-full flex items-center px-2.5 py-1.5 rounded-lg text-sm text-brand-600 dark:text-brand-400 bg-brand-500/10 font-semibold">
              # general
            </button>
          </li>
          <li>
            <button onclick="selectChannel('gaming')" id="btn-gaming" class="w-full flex items-center px-2.5 py-1.5 rounded-lg text-sm text-gray-600 dark:text-zinc-400 hover:bg-gray-100 dark:hover:bg-zinc-800">
              # gaming
            </button>
          </li>
          <li>
            <button onclick="selectChannel('random')" id="btn-random" class="w-full flex items-center px-2.5 py-1.5 rounded-lg text-sm text-gray-600 dark:text-zinc-400 hover:bg-gray-100 dark:hover:bg-zinc-800">
              # random
            </button>
          </li>
        </ul>
      </div>
    </div>

    <!-- User Profile Footer -->
    <div class="p-3 border-t border-gray-200 dark:border-zinc-800 bg-gray-50/50 dark:bg-zinc-900/80 flex items-center justify-between shrink-0">
      <div class="flex items-center gap-2.5 min-w-0">
        <div id="myAvatar" class="w-9 h-9 rounded-full bg-brand-600 flex items-center justify-center text-white font-semibold text-sm shrink-0">
          <span id="myAvatarText">YO</span>
        </div>
        <div class="min-w-0">
          <p id="myDisplayName" class="text-sm font-semibold truncate">You</p>
          <p class="text-xs text-emerald-500 font-medium truncate">Cloud Live Sync</p>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main Chat Area -->
  <main class="flex-1 flex flex-col min-w-0 bg-white dark:bg-zinc-950">
    <header class="h-14 px-4 border-b border-gray-200 dark:border-zinc-800 flex items-center justify-between shrink-0 bg-white/80 dark:bg-zinc-950/80 backdrop-blur-sm">
      <div class="flex items-center gap-3 min-w-0">
        <div class="font-bold text-xl text-gray-400">#</div>
        <div class="min-w-0">
          <h1 id="roomTitle" class="font-bold text-base truncate">general</h1>
          <p class="text-xs text-gray-500 dark:text-zinc-400 truncate">Real-time cloud chat synced across the internet</p>
        </div>
      </div>
    </header>

    <!-- Message Feed -->
    <div id="messageFeed" class="flex-1 overflow-y-auto px-4 py-4 space-y-3"></div>

    <!-- Message Composer -->
    <div class="p-3 shrink-0 border-t border-gray-200 dark:border-zinc-800 bg-white dark:bg-zinc-950">
      <form id="messageForm" onsubmit="handleSendMessage(event)" class="flex items-center gap-2 bg-gray-100 dark:bg-zinc-900 border border-gray-200 dark:border-zinc-800 rounded-xl px-3 py-2">
        <input
          id="messageInput"
          type="text"
          autocomplete="off"
          placeholder="Type a message to your friends..."
          class="flex-1 bg-transparent text-sm focus:outline-none placeholder-gray-400 dark:placeholder-zinc-500"
        />
        <button type="submit" class="px-4 py-1.5 bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium rounded-lg transition">Send</button>
      </form>
    </div>
  </main>

  <!-- Invite Modal -->
  <div id="inviteModal" class="fixed inset-0 bg-black/60 z-50 hidden items-center justify-center p-4">
    <div class="bg-white dark:bg-zinc-900 border border-gray-200 dark:border-zinc-800 rounded-2xl max-w-md w-full p-6 shadow-2xl">
      <h2 class="text-lg font-bold mb-2">Invite Your Friends</h2>
      <p class="text-xs text-gray-500 dark:text-zinc-400 mb-4">Share your hosted link with anyone. They will connect instantly to your cloud chat!</p>
      <div class="flex gap-2">
        <input id="inviteLinkInput" type="text" readonly class="flex-1 px-3 py-2 text-sm rounded-lg bg-gray-100 dark:bg-zinc-800 border border-gray-200 dark:border-zinc-700 font-mono text-xs" />
        <button onclick="copyInviteLink()" class="px-4 py-2 bg-brand-600 text-white text-sm rounded-lg">Copy</button>
      </div>
      <div class="mt-4 text-right">
        <button onclick="closeInviteModal()" class="px-4 py-1.5 text-sm bg-gray-200 dark:bg-zinc-800 rounded-lg">Close</button>
      </div>
    </div>
  </div>

  <script>
    let activeChannel = 'general';
    let currentUser = {
      name: localStorage.getItem('pulsechat_name') || 'User_' + Math.floor(Math.random() * 900 + 100),
      color: 'bg-brand-600'
    };

    function startPulseChat() {
      document.getElementById('myDisplayName').textContent = currentUser.name;
      document.getElementById('myAvatarText').textContent = currentUser.name.slice(0, 2).toUpperCase();
      loadMessages();
    }
    window.startPulseChat = startPulseChat;

    function selectChannel(ch) {
      activeChannel = ch;
      document.getElementById('roomTitle').textContent = ch;
      ['general', 'gaming', 'random'].forEach(c => {
        const btn = document.getElementById(`btn-${c}`);
        if (c === ch) {
          btn.className = "w-full flex items-center px-2.5 py-1.5 rounded-lg text-sm text-brand-600 dark:text-brand-400 bg-brand-500/10 font-semibold";
        } else {
          btn.className = "w-full flex items-center px-2.5 py-1.5 rounded-lg text-sm text-gray-600 dark:text-zinc-400 hover:bg-gray-100 dark:hover:bg-zinc-800";
        }
      });
      loadMessages();
    }

    async function handleSendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text || !window.db) return;

      try {
        await window.firebaseFns.addDoc(window.firebaseFns.collection(window.db, 'channels', activeChannel, 'messages'), {
          senderName: currentUser.name,
          senderColor: currentUser.color,
          text: text,
          timestamp: window.firebaseFns.serverTimestamp()
        });
        input.value = '';
      } catch (err) {
        alert('Error sending message. Make sure Firestore is enabled in your Firebase console!');
      }
    }

    function loadMessages() {
      if (!window.db) return;
      const feed = document.getElementById('messageFeed');
      const q = window.firebaseFns.query(window.firebaseFns.collection(window.db, 'channels', activeChannel, 'messages'), window.firebaseFns.orderBy('timestamp', 'asc'));
      
      window.firebaseFns.onSnapshot(q, (snapshot) => {
        let html = '';
        snapshot.forEach((doc) => {
          const m = doc.data();
          const initials = m.senderName ? m.senderName.slice(0, 2).toUpperCase() : 'US';
          html += `
            <div class="flex items-start gap-3 px-2 py-1">
              <div class="w-8 h-8 rounded-full bg-brand-600 text-white font-bold text-xs flex items-center justify-center shrink-0">${initials}</div>
              <div>
                <div class="flex items-center gap-2"><span class="font-semibold text-sm">${m.senderName}</span></div>
                <p class="text-sm text-gray-800 dark:text-zinc-200">${m.text}</p>
              </div>
            </div>
          `;
        });
        feed.innerHTML = html || '<p class="text-xs text-gray-400 text-center py-6">No messages in #' + activeChannel + '. Say hello!</p>';
        feed.scrollTop = feed.scrollHeight;
      });
    }

    function openInviteModal() {
      document.getElementById('inviteLinkInput').value = window.location.href;
      document.getElementById('inviteModal').classList.remove('hidden');
      document.getElementById('inviteModal').classList.add('flex');
    }
    function closeInviteModal() {
      document.getElementById('inviteModal').classList.add('hidden');
      document.getElementById('inviteModal').classList.remove('flex');
    }
    function copyInviteLink() {
      navigator.clipboard.writeText(window.location.href);
      alert('Link copied to clipboard!');
    }
  </script>
</body>
</html>
