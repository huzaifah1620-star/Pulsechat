<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulseChat Private</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Identity Services SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- Firebase App & Firestore SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
          }
        }
      }
    };
  </script>
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.3); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(156, 163, 175, 0.5); }
  </style>
</head>
<body class="bg-gradient-to-br from-zinc-950 via-zinc-900 to-black text-gray-100 h-screen overflow-hidden flex select-none">

  <!-- Sidebar -->
  <aside id="sidebar" class="fixed md:static inset-y-0 left-0 z-30 w-72 bg-zinc-900/90 backdrop-blur-md border-r border-zinc-800/80 flex flex-col transform -translate-x-full md:translate-x-0 transition-transform duration-200 ease-in-out shadow-xl">
    <div class="h-14 px-4 border-b border-zinc-800/80 flex items-center justify-between shrink-0">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-lg bg-brand-600 flex items-center justify-center text-white font-bold shadow-sm">🔒</div>
        <span class="font-bold text-lg tracking-tight">PulseChat Private</span>
      </div>
    </div>

    <!-- Channels List & Creator -->
    <div class="flex-1 overflow-y-auto px-3 py-4 space-y-6">
      <div>
        <div class="px-2 mb-1.5 flex items-center justify-between">
          <span class="text-xs font-semibold uppercase tracking-wider text-zinc-400">Channels</span>
          <button onclick="createNewChannel()" class="text-xs text-brand-400 hover:text-brand-300 font-bold px-1.5 py-0.5 rounded bg-brand-500/10 transition">+ New</button>
        </div>
        <ul id="channelList" class="space-y-0.5">
          <!-- Dynamically loaded channels appear here -->
        </ul>
      </div>

      <!-- Gmail Invite Section -->
      <div class="px-2">
        <span class="text-xs font-semibold uppercase tracking-wider text-zinc-400 block mb-2">Invite Friends</span>
        <button onclick="openGmailInvite()" class="w-full flex items-center justify-center gap-2 px-3 py-2 rounded-xl text-sm font-medium bg-red-500/10 hover:bg-red-500/20 text-red-400 transition border border-red-500/20 shadow-sm">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
          Invite via Gmail
        </button>
      </div>
    </div>

    <!-- User Profile Footer with Google Sign-In -->
    <div class="p-3 border-t border-zinc-800/80 bg-zinc-900/50 flex flex-col gap-2 shrink-0">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2.5 min-w-0">
          <div id="myAvatar" class="w-9 h-9 rounded-full bg-brand-600 flex items-center justify-center text-white font-semibold text-sm shrink-0 overflow-hidden shadow-sm">
            <span id="myAvatarText">YO</span>
          </div>
          <div class="min-w-0">
            <p id="myDisplayName" class="text-sm font-semibold truncate">You</p>
            <p id="myRoleText" class="text-xs text-emerald-400 font-medium truncate">Secure Mode</p>
          </div>
        </div>
      </div>

      <!-- Admin Clear Chats Button (Hidden by default, shown for Admin) -->
      <button id="clearChatsBtn" onclick="clearAllChats()" class="hidden w-full items-center justify-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium bg-zinc-800 hover:bg-red-500/20 text-zinc-300 hover:text-red-400 transition border border-zinc-700/60 shadow-sm">
        🗑️ Clear All Chats
      </button>

      <!-- Google Sign In Button Container -->
      <div id="googleSignInBtn" class="flex justify-center w-full mt-1 overflow-hidden"></div>
    </div>
  </aside>

  <!-- Main Chat Area -->
  <main class="flex-1 flex flex-col min-w-0 bg-zinc-950">
    <header class="h-14 px-4 border-b border-zinc-800/80 flex items-center justify-between shrink-0 bg-zinc-900/40 backdrop-blur-md">
      <div class="flex items-center gap-3 min-w-0">
        <div class="font-bold text-xl text-zinc-600">#</div>
        <div class="min-w-0">
          <h1 id="roomTitle" class="font-bold text-base truncate">Locked</h1>
          <p class="text-xs text-zinc-400 truncate">Enter passcode upon loading</p>
        </div>
      </div>
    </header>

    <!-- Message Feed -->
    <div id="messageFeed" class="flex-1 overflow-y-auto px-4 py-4 space-y-3"></div>

    <!-- Message Composer -->
    <div class="p-3 shrink-0 border-t border-zinc-800/80 bg-zinc-900/40 backdrop-blur-md">
      <form id="messageForm" onsubmit="handleSendMessage(event)" class="flex items-center gap-2 bg-zinc-900/80 border border-zinc-800 rounded-xl px-3 py-2 shadow-inner">
        <input
          id="messageInput"
          type="text"
          autocomplete="off"
          placeholder="Locked..."
          class="flex-1 bg-transparent text-sm focus:outline-none placeholder-zinc-500 text-zinc-100"
        />
        <button type="submit" class="px-4 py-1.5 bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium rounded-lg shadow-sm transition">Send</button>
      </form>
    </div>
  </main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyB1PJ8csqWPqZY-Ch0MQjjB96qx9QAr7t0",
      authDomain: "pulsechat-962bc.firebaseapp.com",
      projectId: "pulsechat-962bc",
      storageBucket: "pulsechat-962bc.firebasestorage.app",
      messagingSenderId: "1018381268741",
      appId: "1:1018381268741:web:4e6d21670ddfa17c6da96c",
      measurementId: "G-KVM5X53ZPS"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const SECRET_PASSCODE = "mysecret123";
    const ADMIN_EMAIL = "huzaifah1620@gmail.com"; // Replace with your admin email

    let channels = JSON.parse(localStorage.getItem('pulsechat_channels')) || [];
    let activeChannel = channels.length > 0 ? channels[0] : null;
    let currentUser = JSON.parse(localStorage.getItem('pulsechat_user')) || {
      name: 'You',
      picture: null,
      email: null
    };
    let unsubscribeMessages = null;

    function startPulseChat() {
      if (currentUser.email !== ADMIN_EMAIL) {
        let enteredPass = prompt("Enter the Secret Passcode to unlock PulseChat:");
        if (enteredPass !== SECRET_PASSCODE) {
          document.body.innerHTML = `
            <div style="display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh; background:#09090b; color:#f4f4f5; font-family:sans-serif; text-align:center; padding:20px;">
              <div style="font-size:48px; margin-bottom:16px;">🔒</div>
              <h1 style="font-size:24px; font-weight:bold; margin-bottom:8px;">Access Denied</h1>
              <p style="color:#a1a1aa; font-size:14px;">You need the correct secret passcode to view this private chat.</p>
            </div>
          `;
          return;
        }
      }

      updateUserUI();
      renderChannels();
      if (activeChannel) {
        selectChannel(activeChannel);
      } else {
        loadMessages();
      }
      initGoogleAuth();
    }

    function updateUserUI() {
      document.getElementById('myDisplayName').textContent = currentUser.name;
      if (currentUser.email === ADMIN_EMAIL) {
        document.getElementById('myRoleText').textContent = "👑 Admin";
        document.getElementById('myRoleText').className = "text-xs text-brand-400 font-bold truncate";
        // Show clear chats button for admin
        document.getElementById('clearChatsBtn').style.display = 'flex';
      }
      if (currentUser.picture) {
        document.getElementById('myAvatar').innerHTML = `<img src="${currentUser.picture}" class="w-full h-full object-cover"/>`;
      } else {
        document.getElementById('myAvatarText').textContent = currentUser.name.slice(0, 2).toUpperCase();
      }
    }

    function renderChannels() {
      const list = document.getElementById('channelList');
      if (channels.length === 0) {
        list.innerHTML = `<p class="text-xs text-zinc-500 px-2 py-2">No channels unlocked. Click "+ New".</p>`;
        return;
      }
      let html = '';
      channels.forEach(ch => {
        const isActive = ch === activeChannel;
        const className = isActive 
          ? "w-full flex items-center px-2.5 py-1.5 rounded-lg text-sm text-brand-400 bg-brand-500/10 font-semibold border border-brand-500/20"
          : "w-full flex items-center px-2.5 py-1.5 rounded-lg text-sm text-zinc-400 hover:bg-zinc-800/60 hover:text-zinc-200 transition";
        
        html += `
          <li>
            <button onclick="selectChannel('${ch}')" id="btn-${ch}" class="${className}">
              # ${ch}
            </button>
          </li>
        `;
      });
      list.innerHTML = html;
    }

    function createNewChannel() {
      if (currentUser.email !== ADMIN_EMAIL) {
        let pass = prompt("Enter the Secret Passcode to create a channel:");
        if (pass !== SECRET_PASSCODE) {
          alert("Incorrect passcode!");
          return;
        }
      }

      let name = prompt("Enter new channel name:");
      if (!name) return;
      name = name.trim().toLowerCase().replace(/\s+/g, '-');
      
      if (!channels.includes(name)) {
        channels.push(name);
        localStorage.setItem('pulsechat_channels', JSON.stringify(channels));
      }
      renderChannels();
      selectChannel(name);
    }

    function selectChannel(ch) {
      activeChannel = ch;
      document.getElementById('roomTitle').textContent = ch;
      renderChannels();
      loadMessages();
    }

    function loadMessages() {
      const feed = document.getElementById('messageFeed');
      if (!activeChannel) {
        feed.innerHTML = '<p class="text-xs text-zinc-500 text-center py-6">No channel selected.</p>';
        return;
      }

      if (unsubscribeMessages) {
        unsubscribeMessages();
      }

      unsubscribeMessages = db.collection('channels').doc(activeChannel).collection('messages')
        .orderBy('timestamp', 'asc')
        .onSnapshot((snapshot) => {
          let html = '';
          snapshot.forEach((doc) => {
            const m = doc.data();
            const avatarHtml = m.senderPic 
              ? `<img src="${m.senderPic}" class="w-full h-full object-cover"/>` 
              : `<span class="text-xs">${(m.senderName || 'U').slice(0, 2).toUpperCase()}</span>`;

            html += `
              <div class="flex items-start gap-3 px-2 py-1.5 hover:bg-zinc-900/30 rounded-lg transition">
                <div class="w-8 h-8 rounded-full bg-brand-600 text-white font-bold text-xs flex items-center justify-center shrink-0 overflow-hidden shadow-sm">${avatarHtml}</div>
                <div>
                  <div class="flex items-center gap-2">
                    <span class="font-semibold text-sm text-zinc-200">${escapeHtml(m.senderName)}</span>
                    <span class="text-xs text-zinc-500">${m.time}</span>
                  </div>
                  <p class="text-sm text-zinc-300 leading-relaxed">${escapeHtml(m.text)}</p>
                </div>
              </div>
            `;
          });
          feed.innerHTML = html || `<p class="text-xs text-zinc-500 text-center py-6">No messages in #${activeChannel}. Be the first to say something!</p>`;
          feed.scrollTop = feed.scrollHeight;
        });
    }

    function handleSendMessage(e) {
      e.preventDefault();
      if (!activeChannel) {
        alert('Please select or create a channel first!');
        return;
      }
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text) return;

      db.collection('channels').doc(activeChannel).collection('messages').add({
        senderName: currentUser.name,
        senderPic: currentUser.picture || null,
        text: text,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        input.value = '';
      }).catch((error) => {
        console.error("Error sending message: ", error);
        alert("Failed to send message.");
      });
    }

    async function clearAllChats() {
      if (!confirm("Are you sure you want to clear all channels and message history?")) return;
      
      try {
        // Delete messages in active channel from Firestore
        if (activeChannel) {
          const snapshot = await db.collection('channels').doc(activeChannel).collection('messages').get();
          const batch = db.batch();
          snapshot.docs.forEach((doc) => batch.delete(doc.ref));
          await batch.commit();
        }

        // Clear local storage channels
        localStorage.removeItem('pulsechat_channels');
        channels = [];
        activeChannel = null;
        renderChannels();
        document.getElementById('messageFeed').innerHTML = '<p class="text-xs text-zinc-500 text-center py-6">All chats cleared.</p>';
        document.getElementById('roomTitle').textContent = 'No Channel Selected';
        alert("All chats have been cleared successfully!");
      } catch (err) {
        console.error(err);
        alert("Error clearing chats. Check console.");
      }
    }

    function escapeHtml(text) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return text.replace(/[&<>"']/g, m => map[m]);
    }

    function openGmailInvite() {
      const subject = encodeURIComponent("Join me on PulseChat!");
      const body = encodeURIComponent("Hey! Check out my private chat app here: " + window.location.href + " (Passcode: " + SECRET_PASSCODE + ")");
      window.open(`https://mail.google.com/mail/?view=cm&fs=1&su=${subject}&body=${body}`, '_blank');
    }

    function initGoogleAuth() {
      google.accounts.id.initialize({
        client_id: "25253582318-iqevtg253cplo4am4i1qdj0sevoasq6s.apps.googleusercontent.com",
        callback: handleCredentialResponse
      });
      google.accounts.id.renderButton(
        document.getElementById("googleSignInBtn"),
        { theme: "filled_black", size: "medium", width: "220" }
      );
    }

    function handleCredentialResponse(response) {
      const base64Url = response.credential.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
      const profile = JSON.parse(jsonPayload);

      currentUser = {
        name: profile.name,
        picture: profile.picture,
        email: profile.email
      };

      localStorage.setItem('pulsechat_user', JSON.stringify(currentUser));
      updateUserUI();
      alert('Successfully signed in as ' + currentUser.name + ' (' + currentUser.email + ')!');
      window.location.reload();
    }

    window.onload = startPulseChat;
  </script>
</body>
</html>
